name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# En las ramas de trabajo una ejecución nueva cancela la anterior; en main no, para
# no cortar un despliegue a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  calidad:
    name: Lint, tipos y pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias desde uv.lock
        run: uv sync --locked

      - name: Máximo 400 líneas por archivo de código
        run: uv run python scripts/verificar_lineas.py

      - name: Catálogo de libros válido
        run: uv run python scripts/validar_catalogo.py

      - name: Formato
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy app

      - name: Pruebas con cobertura
        run: uv run pytest --cov --cov-report=term

      - name: requirements.txt sincronizado con uv.lock
        if: matrix.python == '3.12'
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-header -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt || {
            echo "::error::requirements.txt está desactualizado. Ejecutar: uv export --no-dev --no-hashes --no-emit-project --no-header -o requirements.txt"
            exit 1
          }

  imagen:
    name: Imagen Docker y prueba de humo
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t chatbot-llm-rag:ci .

      - name: Arrancar sin claves (modo demo) y esperar a que esté lista
        run: |
          docker run -d --name app -p 8000:8000 chatbot-llm-rag:ci
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health/ready; then
              echo
              curl -fsS -X POST http://localhost:8000/api/chat \
                -H 'Content-Type: application/json' \
                -d '{"mensaje":"¿cuánto cuesta el envío?","usuario_id":"ci","session_id":"ci"}'
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

  # Solo en un push a main (es decir, cuando el dueño une un pull request) y solo si
  # las pruebas y la imagen pasaron. En pull requests y en dev este job se omite.
  desplegar:
    name: Desplegar
    needs: [calidad, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/cd.yml
