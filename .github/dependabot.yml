# Actualizaciones automáticas de acciones de GitHub y de la imagen base de Docker.
# Los pull requests se abren contra dev, nunca directamente contra main.
# Las dependencias de Python se actualizan con `uv lock --upgrade` para mantener
# uv.lock y requirements.txt sincronizados en el mismo commit.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    ignore:
      # La versión de Python (3.12) es una decisión del proyecto: solo se aceptan
      # actualizaciones de la misma versión, no saltos a 3.13, 3.14, etc.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
