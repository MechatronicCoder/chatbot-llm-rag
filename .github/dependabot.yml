# Actualizaciones automáticas de acciones de GitHub y de la imagen base de Docker.
# Las dependencias de Python se actualizan con `uv lock --upgrade` para mantener
# uv.lock y requirements.txt sincronizados en el mismo commit.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
