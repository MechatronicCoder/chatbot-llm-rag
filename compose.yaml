# Entorno local con Docker: `docker compose up --build` y abrir http://localhost:8000
services:
  app:
    build: .
    image: chatbot-llm-rag:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # sin .env arranca en modo demo
    volumes:
      # El frontend se monta desde el disco: un cambio en HTML/CSS/JS se ve con F5.
      - ./frontend:/app/frontend:ro
      # Base SQLite, logs y caché de embeddings sobreviven a `docker compose down`.
      - estado:/app/var

volumes:
  estado:
