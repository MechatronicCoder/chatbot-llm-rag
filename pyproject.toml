[project]
name = "chatbot-llm-rag"
version = "0.1.0"
description = "Chatbot con LLM, RAG y herramientas sobre FastAPI, listo para desplegar en Azure Container Apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

# ---------------------------------------------------------------------------
# Herramientas de calidad
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["var"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # orden de imports
    "B",   # bugbear: errores probables
    "UP",  # sintaxis moderna
    "SIM", # simplificaciones
    "S",   # seguridad (bandit)
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caracteres "ambiguos": el código está en español (¿, ¡, …)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y claves de prueba
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # aviso de Starlette sobre el cliente HTTP de TestClient; no afecta a la app
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
